# Example for HTTPS reverse proxy access through QNAP/Caddy.
# Replace the public HTTPS origin and set PALMTTY_ACCESS_TOKEN to a long
# random secret in the Agent user's environment.
# Workspaces are managed after sign-in through the PalmTTY Web UI.

server:
  host: 0.0.0.0
  port: 7688
  trustedOrigins:
    - https://dev.example.com
  secureCookies: true
  unsafeAllowInsecureLan: false

auth:
  enabled: true
  tokenEnv: PALMTTY_ACCESS_TOKEN
  maxLoginSessions: 32
  sessionTtlMinutes: 720

sessions:
  maxSessions: 8
  exitedRetentionMinutes: 30
  scrollbackLines: 10000
  replayBytes: 2097152
  maxSocketBufferedBytes: 2097152
