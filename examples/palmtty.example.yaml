# Safe local example.
# Copy to palmtty.local.yaml, set PALMTTY_ACCESS_TOKEN, and start PalmTTY.
# Normal build/start/autostart serves the compiled Web UI from the Agent.
# Workspaces are intentionally not configured here: create and manage them
# after signing in through the PalmTTY web UI.
#
# To allow direct private-LAN HTTP access, change exposure.mode to "lan".
# That mode is intentionally explicit because terminal/login traffic is not
# encrypted. Prefer reverseProxy or direct HTTPS for normal remote use.
#
# `pnpm dev` is separate: Vite listens on 0.0.0.0:5173 and dynamically adds
# exact private/overlay development Origins while the Agent follows this config.

server:
  port: 17688
  exposure:
    mode: local

auth:
  enabled: true
  tokenEnv: PALMTTY_ACCESS_TOKEN
  maxLoginSessions: 32
  sessionTtlMinutes: 720

sessions:
  maxSessions: 8
  exitedRetentionMinutes: 30
  scrollbackLines: 10000
  replayBytes: 2097152
  maxSocketBufferedBytes: 2097152

# Optional independently managed official VS Code Web / DeepSeek Harness links.
# URLs must use HTTPS (or loopback HTTP) and must NOT contain connection tokens.
# For private IP entries add server.privateGateway: { listenHost: <private IPv4>, httpsPort: 443 }
# with server.exposure.mode: lan. Managed access URLs are derived automatically.
# integrations:
#   vscodeWeb:
#     mode: managed
#     autoStart: false # personal opt-in; install official VS Code and accept its terms first
#     port: 8000
#   harness:
#     mode: managed
#     autoStart: true
#     port: 3080
# External alternative: harness: { mode: external, url: https://harness.example.test/ }

# Optional high-quality local novel reader. Start the separate Python sidecar,
# configure PALMTTY_QWEN_TOKEN in both its environment and the Agent's env-file,
# then enable this endpoint. The model never runs inside the terminal Worker.
speech:
  qwen:
    enabled: false
    port: 18765
