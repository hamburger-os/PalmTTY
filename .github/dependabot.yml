version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    # @types/node follows the supported Node 24 runtime major. Keep newer
    # majors out until CI, native PTY and bundled distribution move together.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      # All five xterm packages are a tested, precisely-pinned stack governed by
      # terminal-stack.json. Individually proposed updates always break the
      # single source of truth; upgrade the family together in a reviewed PR.
      - dependency-name: "@xterm/*"
      # Major Mermaid upgrades change rendering/sandbox integration and can
      # introduce licenses outside the reviewed production policy.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
      # Keep jsdom major transitions separate from the Node runtime migration:
      # browser simulation and DOM API changes require their own qualification.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
