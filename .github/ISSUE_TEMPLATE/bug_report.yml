name: Bug report
description: Report a reproducible PalmTTY defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PalmTTY. Do not paste secrets, access tokens, cookies, private keys or sensitive terminal transcripts.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start PalmTTY with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 / GitHub Actions windows-latest / other
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: pwsh 7.x
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser / device
      placeholder: iPhone Safari, Android Chrome, desktop Edge...
    validations:
      required: true
  - type: dropdown
    id: exposure
    attributes:
      label: Connection path
      options:
        - Loopback / same workstation
        - Private network + HTTPS
        - HTTPS reverse proxy
        - Development-only insecure LAN override
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste minimal sanitized logs or errors. Do not include terminal I/O or secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, cookies, tokens, private keys and sensitive terminal contents.
          required: true
