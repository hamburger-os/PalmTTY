name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, X.Y.Z-alpha.N, beta.N or rc.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palmtty-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Resolve immutable release source
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual releases must be started from main."
            exit 1
          fi
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$REMOTE_MAIN"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced before release preparation."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Release tags are immutable."
            exit 1
          fi

          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm release:check -- "$VERSION"

  quality:
    name: Quality Gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  security:
    name: Dependency Security and License Gate
    needs: prepare
    uses: ./.github/workflows/security-audit.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  codeql:
    name: CodeQL Gate
    needs: prepare
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    name: Publish verified release
    needs: [prepare, quality, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Create, verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          CREATED_TAG=false
          CREATED_RELEASE=false
          RELEASE_ID=""
          FINALIZED=false

          cleanup() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$FINALIZED" != "true" ]; then
              echo "::warning::Release validation failed; rolling back the tag/release created by this run."
              if [ "$CREATED_RELEASE" = "true" ]; then
                if [ -n "$RELEASE_ID" ]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" >/dev/null 2>&1 || true
                else
                  gh release delete "$TAG" --yes --cleanup-tag=false >/dev/null 2>&1 || true
                fi
              fi
              if [ "$CREATED_TAG" = "true" ]; then
                git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
              fi
            fi
            exit "$code"
          }
          trap cleanup EXIT

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced while release gates were running; restart the Release workflow."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists."
            exit 1
          fi

          node scripts/release-notes.mjs "$VERSION" > /tmp/palmtty-release-notes.md
          test -s /tmp/palmtty-release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SOURCE_SHA" -m "PalmTTY $TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          git push origin "refs/tags/$TAG"
          CREATED_TAG=true

          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Remote annotated tag does not resolve to the qualified source SHA."
            exit 1
          fi

          jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --rawfile body /tmp/palmtty-release-notes.md \
            --argjson prerelease "$PRERELEASE" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: true,
              prerelease: $prerelease
            }' > /tmp/palmtty-release-create.json

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            --input /tmp/palmtty-release-create.json \
            > /tmp/palmtty-release.json
          CREATED_RELEASE=true

          RELEASE_ID="$(jq -r '.id // empty' /tmp/palmtty-release.json)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::GitHub did not return a Release ID."
            exit 1
          fi
          jq --arg tag "$TAG" --argjson prerelease "$PRERELEASE" -e '
            .tag_name == $tag and
            .name == $tag and
            .draft == true and
            .prerelease == $prerelease and
            (.body | length) > 20
          ' /tmp/palmtty-release.json >/dev/null

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ] || [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Source or tag moved before release promotion; rolling back this run."
            exit 1
          fi

          printf '%s\n' '{"draft":false}' > /tmp/palmtty-release-publish.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            --input /tmp/palmtty-release-publish.json \
            > /tmp/palmtty-release-final.json

          jq --arg tag "$TAG" --argjson prerelease "$PRERELEASE" -e '
            .tag_name == $tag and
            .name == $tag and
            .draft == false and
            .prerelease == $prerelease and
            .published_at != null and
            (.body | length) > 20
          ' /tmp/palmtty-release-final.json >/dev/null

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ] || [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Source or tag moved during release promotion; rolling back this run."
            exit 1
          fi

          FINALIZED=true
          echo "Published $TAG from immutable source $SOURCE_SHA."
