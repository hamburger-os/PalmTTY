name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, X.Y.Z-alpha.N, beta.N or rc.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palmtty-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Resolve immutable release source
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual releases must be started from main."
            exit 1
          fi
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$REMOTE_MAIN"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced before release preparation."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Release tags are immutable."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $TAG."
            exit 1
          fi

          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm release:check -- "$VERSION"

  quality:
    name: Quality Gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  security:
    name: Dependency Security and License Gate
    needs: prepare
    uses: ./.github/workflows/security-audit.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  codeql:
    name: CodeQL Gate
    needs: prepare
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  package-windows:
    name: Package / Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build installed runtime
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $PWD "dist/PalmTTY-$env:VERSION-win-x64"
          node scripts/package-runtime.mjs --out "$runtime" --platform win32 --arch x64
          node scripts/package-smoke.mjs --root "$runtime"

          $assets = Join-Path $PWD "dist/release-windows"
          New-Item -ItemType Directory -Force $assets | Out-Null
          Copy-Item (Join-Path $runtime "sbom.cdx.json") (Join-Path $assets "PalmTTY-$env:VERSION-win-x64.sbom.cdx.json")
          Compress-Archive -Path (Join-Path $runtime "*") -DestinationPath (Join-Path $assets "PalmTTY-$env:VERSION-win-x64.zip") -CompressionLevel Optimal

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 is unavailable on the GitHub Windows runner: $iscc"
          }
          & $iscc "/DVersion=$env:VERSION" "/DSourceDir=$runtime" "/DOutputDir=$assets" "packaging/windows/PalmTTY.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $expected = @(
            "PalmTTY-Setup-$env:VERSION-win-x64.exe",
            "PalmTTY-$env:VERSION-win-x64.zip",
            "PalmTTY-$env:VERSION-win-x64.sbom.cdx.json"
          )
          $actual = @(Get-ChildItem $assets -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object ($expected | Sort-Object) $actual) {
            throw "Windows release assets do not match the expected set: $($actual -join ', ')"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: dist/release-windows/*
          if-no-files-found: error
          compression-level: 0

  package-linux:
    name: Package / Linux x64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build installed runtime
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          runtime="$PWD/dist/PalmTTY-$VERSION-linux-x64"
          assets="$PWD/dist/release-linux"
          mkdir -p "$assets"

          node scripts/package-runtime.mjs --out "$runtime" --platform linux --arch x64
          node scripts/package-smoke.mjs --root "$runtime"
          cp "$runtime/sbom.cdx.json" "$assets/PalmTTY-$VERSION-linux-x64.sbom.cdx.json"
          tar -C "$runtime" -czf "$assets/PalmTTY-$VERSION-linux-x64.tar.gz" .
          node scripts/package-linux-deb.mjs             --root "$runtime"             --out "$assets/palmtty_${VERSION}_amd64.deb"

          expected=(
            "PalmTTY-$VERSION-linux-x64.tar.gz"
            "PalmTTY-$VERSION-linux-x64.sbom.cdx.json"
            "palmtty_${VERSION}_amd64.deb"
          )
          mapfile -t actual < <(find "$assets" -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-assets.txt
          printf '%s\n' "${actual[@]}" > /tmp/actual-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/actual-assets.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: dist/release-linux/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified release
    needs: [prepare, quality, security, codeql, package-windows, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: /tmp/palmtty-assets
          merge-multiple: true
      - name: Verify and checksum release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp/palmtty-assets
          expected=(
            "PalmTTY-Setup-$VERSION-win-x64.exe"
            "PalmTTY-$VERSION-win-x64.zip"
            "PalmTTY-$VERSION-win-x64.sbom.cdx.json"
            "PalmTTY-$VERSION-linux-x64.tar.gz"
            "PalmTTY-$VERSION-linux-x64.sbom.cdx.json"
            "palmtty_${VERSION}_amd64.deb"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-assets.txt
          printf '%s\n' "${actual[@]}" > /tmp/actual-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/actual-assets.txt
          sha256sum "${expected[@]}" > SHA256SUMS
          test -s SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/palmtty-assets/*
      - name: Create, upload, verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          CREATED_TAG=false
          CREATED_RELEASE=false
          RELEASE_ID=""
          FINALIZED=false

          cleanup() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$FINALIZED" != "true" ]; then
              echo "::warning::Release validation failed; rolling back the tag/release created by this run."
              if [ "$CREATED_RELEASE" = "true" ]; then
                if [ -n "$RELEASE_ID" ]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" >/dev/null 2>&1 || true
                else
                  gh release delete "$TAG" --yes --cleanup-tag=false >/dev/null 2>&1 || true
                fi
              fi
              if [ "$CREATED_TAG" = "true" ]; then
                git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
              fi
            fi
            exit "$code"
          }
          trap cleanup EXIT

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ]; then
            echo "::error::main advanced while release gates were running; restart the Release workflow."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists."
            exit 1
          fi

          node scripts/release-notes.mjs "$VERSION" > /tmp/palmtty-release-notes.md
          test -s /tmp/palmtty-release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SOURCE_SHA" -m "PalmTTY $TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          git push origin "refs/tags/$TAG"
          CREATED_TAG=true

          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Remote annotated tag does not resolve to the qualified source SHA."
            exit 1
          fi

          jq -n             --arg tag "$TAG"             --arg name "$TAG"             --rawfile body /tmp/palmtty-release-notes.md             --argjson prerelease "$PRERELEASE"             '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: true,
              prerelease: $prerelease
            }' > /tmp/palmtty-release-create.json

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases"             --input /tmp/palmtty-release-create.json             > /tmp/palmtty-release.json
          CREATED_RELEASE=true

          RELEASE_ID="$(jq -r '.id // empty' /tmp/palmtty-release.json)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::GitHub did not return a Release ID."
            exit 1
          fi
          jq --arg tag "$TAG" --argjson prerelease "$PRERELEASE" -e '
            .tag_name == $tag and
            .name == $tag and
            .draft == true and
            .prerelease == $prerelease and
            (.body | length) > 20
          ' /tmp/palmtty-release.json >/dev/null

          expected_assets=(
            "PalmTTY-Setup-$VERSION-win-x64.exe"
            "PalmTTY-$VERSION-win-x64.zip"
            "PalmTTY-$VERSION-win-x64.sbom.cdx.json"
            "PalmTTY-$VERSION-linux-x64.tar.gz"
            "PalmTTY-$VERSION-linux-x64.sbom.cdx.json"
            "palmtty_${VERSION}_amd64.deb"
            "SHA256SUMS"
          )
          for name in "${expected_assets[@]}"; do
            asset="/tmp/palmtty-assets/$name"
            test -s "$asset"
            curl --fail-with-body --silent --show-error               --request POST               --header "Authorization: Bearer $GH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               --header "Content-Type: application/octet-stream"               --data-binary "@$asset"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?name=$name"               > "/tmp/upload-$name.json"
            jq --arg name "$name" -e '.name == $name and .state == "uploaded" and .size > 0'               "/tmp/upload-$name.json" >/dev/null
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?per_page=100"             > /tmp/palmtty-release-assets.json
          test "$(jq 'length' /tmp/palmtty-release-assets.json)" -eq "${#expected_assets[@]}"
          for name in "${expected_assets[@]}"; do
            local_size="$(stat -c '%s' "/tmp/palmtty-assets/$name")"
            remote_size="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .size' /tmp/palmtty-release-assets.json)"
            if [ -z "$remote_size" ] || [ "$remote_size" != "$local_size" ]; then
              echo "::error::Release asset verification failed for $name (local=$local_size remote=${remote_size:-missing})."
              exit 1
            fi
          done

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ] || [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Source or tag moved before release promotion; rolling back this run."
            exit 1
          fi

          printf '%s\n' '{"draft":false}' > /tmp/palmtty-release-publish.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"             --input /tmp/palmtty-release-publish.json             > /tmp/palmtty-release-final.json

          jq --arg tag "$TAG" --argjson prerelease "$PRERELEASE" -e '
            .tag_name == $tag and
            .name == $tag and
            .draft == false and
            .prerelease == $prerelease and
            .published_at != null and
            (.body | length) > 20
          ' /tmp/palmtty-release-final.json >/dev/null

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_TAG_TARGET="$(
            git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}'
          )"
          if [ "$REMOTE_MAIN" != "$SOURCE_SHA" ] || [ "$REMOTE_TAG_TARGET" != "$SOURCE_SHA" ]; then
            echo "::error::Source or tag moved during release promotion; rolling back this run."
            exit 1
          fi

          FINALIZED=true
          echo "Published $TAG from immutable source $SOURCE_SHA with ${#expected_assets[@]} verified assets."
