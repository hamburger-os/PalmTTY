name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to validate
        required: true
        type: string

concurrency:
  # Reusable workflows inherit the caller's github context. Use the explicit
  # workflow_call input when present and keep each gate in its own namespace.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: CI / check (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          PALMTTY_TEST_REQUIRE_PWSH: ${{ runner.os == 'Windows' && '1' || '0' }}
      - name: Validate unattended Windows PowerShell probe syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/unattended-readiness.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Smoke native gateway diagnostic without installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $raw = & node scripts/unattended-readiness.mjs --json
          $status = $LASTEXITCODE
          if ($status -gt 1) { throw 'The Windows native gateway read-only probe failed to run' }
          $result = ($raw -join "`n") | ConvertFrom-Json
          if ($result.schema -ne 2 -or $result.target -ne 'windows-native') {
            throw 'Unexpected native gateway probe protocol'
          }
          if ($result.endToEndCertified -ne $false) {
            throw 'The readiness probe must never certify browser RDP without real-device tests'
          }
          # A missing native Gateway is the expected negative-runner fixture (exit 1).
          # GitHub's pwsh wrapper propagates LASTEXITCODE unless explicitly cleared.
          exit 0
