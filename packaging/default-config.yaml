# PalmTTY installed-runtime default.
# The installer/CLI stores this file in the current user's configuration
# directory and keeps it across application upgrades.

server:
  port: 17688
  exposure:
    mode: local

auth:
  enabled: true
  tokenEnv: PALMTTY_ACCESS_TOKEN
  maxLoginSessions: 32
  sessionTtlMinutes: 720

sessions:
  maxSessions: 8
  exitedRetentionMinutes: 30
  scrollbackLines: 10000
  replayBytes: 2097152
  maxSocketBufferedBytes: 2097152

remoteApps:
  enabled: true
  maxSessions: 4
  exitedRetentionMinutes: 30
  webrtc:
    # Empty is sufficient on the same LAN/VPN when direct host candidates are
    # routable. Reverse-proxy/public deployments may need STUN/TURN here.
    # ICE credentials are delivered only to authenticated Remote App clients.
    iceServers: []
